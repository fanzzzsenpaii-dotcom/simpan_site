<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Media Publik - Showcase</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Navigasi */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 1.5rem;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* Tombol Pindah Halaman ke Upload */
    .btn-goto-upload {
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-goto-upload:hover {
      background: var(--accent-hover);
    }

    /* Search Box */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px 20px 14px 45px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Grid Media */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .media-preview {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .share-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <i class="fa-solid fa-photo-film"></i>
        <h1>Galeri Media Publik</h1>
      </div>
      <a href="simpansite.html" class="btn-goto-upload">
        <i class="fa-solid fa-plus"></i> Tambah Media Baru
      </a>
    </header>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Cari nama file media...">
    </div>

    <div class="media-grid" id="media-grid">
      </div>
  </div>

  <script>
    // MASUKKAN URL DAN KEY SUPABASE KAMU DI SINI
    const SUPABASE_URL = 'https://ypggmvkgnjeflbkxooot.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwZ2dtdmtnbmplZmxia3hvb290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTUwMTMsImV4cCI6MjEwMzk5MTAxM30.KZ6cRJeJEbnvAarR8x9YCU_fjAbGSsIQ1uzOsum_8-4';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const mediaGrid = document.getElementById('media-grid');
    const searchInput = document.getElementById('search-input');
    let allMediaData = [];

    // Ambil Data Media Publik
    async function fetchPublicMedia() {
      mediaGrid.innerHTML = '<p style="color: var(--text-muted);">Memuat media...</p>';

      const { data, error } = await supabaseClient
        .from('media_files')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        mediaGrid.innerHTML = '<p style="color: var(--text-muted);">Gagal mengambil data media.</p>';
        return;
      }

      allMediaData = data;
      renderMedia(allMediaData);
    }

    // Tampilkan ke Grid
    function renderMedia(items) {
      if (items.length === 0) {
        mediaGrid.innerHTML = '<p style="color: var(--text-muted);">Tidak ada media ditemukan.</p>';
        return;
      }

      mediaGrid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card';

        let previewElement = '';
        if (item.file_type.startsWith('image/')) {
          previewElement = `<img src="${item.file_url}" class="media-preview" alt="${item.file_name}" loading="lazy">`;
        } else if (item.file_type.startsWith('video/')) {
          previewElement = `<video src="${item.file_url}" class="media-preview" controls></video>`;
        } else if (item.file_type.startsWith('audio/')) {
          previewElement = `<div class="media-preview"><audio src="${item.file_url}" controls></audio></div>`;
        } else {
          previewElement = `<div class="media-preview">Media</div>`;
        }

        card.innerHTML = `
          ${previewElement}
          <div class="media-body">
            <div class="file-title" title="${item.file_name}">${item.file_name}</div>
            <button class="share-btn" onclick="copyLink('${item.file_url}')">
              <i class="fa-regular fa-copy"></i> Salin Tautan
            </button>
          </div>
        `;

        mediaGrid.appendChild(card);
      });
    }

    // Filter Cari
    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = allMediaData.filter(item => 
        item.file_name.toLowerCase().includes(keyword)
      );
      renderMedia(filtered);
    });

    // Salin Tautan
    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('Tautan media berhasil disalin!');
      });
    }

    fetchPublicMedia();
  </script>
</body>
</html>
