<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMedia - Galeri & Upload Media</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 1.6rem;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .upload-box:hover {
      border-color: var(--accent);
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .file-label:hover {
      background: var(--accent-hover);
    }

    #file-input { display: none; }

    #file-name {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .upload-btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .upload-btn:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: var(--border);
      width: 100%;
    }

    .gallery-header {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 20px 12px 42px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .media-preview {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .share-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <h1>ShareMedia</h1>
      </div>
    </header>

    <!-- UPLOAD SECTION -->
    <section>
      <div class="section-title">
        <i class="fa-solid fa-upload" style="color: var(--accent);"></i> Unggah Media Baru
      </div>
      <div class="upload-card">
        <div class="upload-box">
          <label for="file-input" class="file-label">
            <i class="fa-solid fa-paperclip"></i> Pilih File
          </label>
          <input type="file" id="file-input" accept="image/*,audio/*,video/*">
          <div id="file-name">Pilih gambar, MP3, atau MP4 dari perangkatmu</div>
        </div>

        <button class="upload-btn" id="upload-btn" disabled>
          <i class="fa-solid fa-cloud-arrow-up"></i> Unggah Sekarang
        </button>
      </div>
    </section>

    <div class="divider"></div>

    <!-- GALLERY SECTION -->
    <section class="gallery-header">
      <div class="section-title">
        <i class="fa-solid fa-photo-film" style="color: var(--accent);"></i> Galeri Media Publik
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Cari media berdasarkan nama...">
      </div>
    </section>

    <div class="media-grid" id="media-grid">
      <!-- Media Items dinamik dari JavaScript -->
    </div>
  </div>

  <!-- SUPABASE & APPLICATION LOGIC -->
  <script>
    // 1. MASUKKAN SUPABASE URL DAN ANON KEY KAMU DI SINI
    const SUPABASE_URL = 'https://ypggmvkgnjeflbkxooot.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwZ2dtdmtnbmplZmxia3hvb290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTUwMTMsImV4cCI6MjEwMzk5MTAxM30.KZ6cRJeJEbnvAarR8x9YCU_fjAbGSsIQ1uzOsum_8-4';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fileInput = document.getElementById('file-input');
    const fileNameDisplay = document.getElementById('file-name');
    const uploadBtn = document.getElementById('upload-btn');
    const mediaGrid = document.getElementById('media-grid');
    const searchInput = document.getElementById('search-input');

    let allMediaData = [];

    // Deteksi Pilihan File
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        fileNameDisplay.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        uploadBtn.disabled = false;
      } else {
        fileNameDisplay.textContent = 'Pilih gambar, MP3, atau MP4 dari perangkatmu';
        uploadBtn.disabled = true;
      }
    });

    // Proses Upload File ke Supabase
    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...';

      try {
        const fileExt = file.name.split('.').pop();
        const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        // Upload ke Supabase Storage (Bucket: media)
        const { data: storageData, error: storageError } = await supabaseClient
          .storage
          .from('media')
          .upload(cleanFileName, file);

        if (storageError) throw storageError;

        // Ambil Public URL File
        const { data: urlData } = supabaseClient
          .storage
          .from('media')
          .getPublicUrl(cleanFileName);

        const publicUrl = urlData.publicUrl;

        // Simpan Metadata ke Tabel Database (Tabel: media_files)
        const { error: dbError } = await supabaseClient
          .from('media_files')
          .insert([
            {
              file_name: file.name,
              file_url: publicUrl,
              file_type: file.type
            }
          ]);

        if (dbError) throw dbError;

        alert('Berhasil mengunggah media!');
        fileInput.value = '';
        fileNameDisplay.textContent = 'Pilih gambar, MP3, atau MP4 dari perangkatmu';
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Unggah Sekarang';

        // Refresh Galeri
        fetchMedia();

      } catch (err) {
        alert('Gagal mengunggah: ' + err.message);
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Unggah Sekarang';
      }
    });

    // Fetch Galeri Media dari Database
    async function fetchMedia() {
      mediaGrid.innerHTML = '<div style="color: var(--text-muted);">Memuat galeri...</div>';

      const { data, error } = await supabaseClient
        .from('media_files')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        mediaGrid.innerHTML = '<div style="color: red;">Gagal memuat media.</div>';
        return;
      }

      allMediaData = data;
      renderMedia(allMediaData);
    }

    // Render HTML untuk Galeri
    function renderMedia(items) {
      if (items.length === 0) {
        mediaGrid.innerHTML = '<div style="color: var(--text-muted);">Belum ada media yang diunggah.</div>';
        return;
      }

      mediaGrid.innerHTML = items.map(item => {
        let previewHtml = '';

        if (item.file_type.startsWith('image/')) {
          previewHtml = `<img src="${item.file_url}" class="media-preview" alt="${item.file_name}" loading="lazy">`;
        } else if (item.file_type.startsWith('video/')) {
          previewHtml = `<video src="${item.file_url}" class="media-preview" controls></video>`;
        } else if (item.file_type.startsWith('audio/')) {
          previewHtml = `<div class="media-preview"><audio src="${item.file_url}" controls style="width: 90%;"></audio></div>`;
        } else {
          previewHtml = `<div class="media-preview"><i class="fa-solid fa-file-lines fa-3x" style="color: var(--text-muted)"></i></div>`;
        }

        return `
          <div class="media-card">
            ${previewHtml}
            <div class="media-body">
              <div class="file-title" title="${item.file_name}">${item.file_name}</div>
              <button class="share-btn" onclick="copyLink('${item.file_url}')">
                <i class="fa-solid fa-link"></i> Salin Tautan
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Fitur Salin Link
    function copyLink(url) {
      navigator.clipboard.writeText(url);
      alert('Tautan file berhasil disalin!');
    }

    // Fitur Live Search
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allMediaData.filter(item => item.file_name.toLowerCase().includes(query));
      renderMedia(filtered);
    });

    // Load Galeri saat Halaman Pertama Dimuat
    fetchMedia();
  </script>

  <!-- SCRIPT PROTEKSI (ANTI-CLONE / ANTI-INSPECT) -->
  <script>
    // Matikan Klik Kanan
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Matikan Tombol F12 & Shortkey DevTools (Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
    document.onkeydown = function (e) {
      if (e.keyCode == 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
         (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
  </script>

</body>
</html>
